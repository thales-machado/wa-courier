name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "grafana/**"
      - "renovate.json"
  # lint + tests must gate the merge, not report after it — a formatting error once landed on
  # main unnoticed because CI only ran on push
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # actions are pinned by commit SHA (with the tag as a comment): a public repo publishing
  # images with GITHUB_TOKEN shouldn't trust mutable tags — Renovate keeps the pins updated
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Detects whether this push carries a package.json version that doesn't have a tag yet.
  # Runs on the same gate as build/release below, so it's never "skipped" while they run —
  # that would make GitHub treat their `needs: check-version` as unmet and skip them too.
  check-version:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: check
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION="$(jq -r .version package.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$REF" = "refs/heads/main" ] && ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # PRs only validate (lint/tests above); the image is built and published on push/tag
    if: github.event_name != 'pull_request'
    needs: [lint, check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=v${{ needs.check-version.outputs.version }},enable=${{ needs.check-version.outputs.is_release == 'true' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Either a manually-pushed vX.Y.Z tag (kept for a rare manual override), or a package.json
    # version bump landing on main that check-version determined has no tag yet. In the latter
    # case the tag doesn't exist — action-gh-release creates it, pointed at this exact commit,
    # as part of creating the release. That tag creation is via the GitHub API, not a `git push`,
    # so it doesn't re-trigger this workflow (nor would it need to: build already ran above).
    if: needs.check-version.outputs.is_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.check-version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
