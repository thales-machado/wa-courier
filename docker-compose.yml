services:
  wa-courier:
    # pinned to a released version so a plain `docker compose pull` can't drag in breaking
    # changes unnoticed — bump deliberately (Renovate proposes updates)
    image: ghcr.io/thaleslimao/wa-courier:1.0.0
    container_name: wa-courier
    restart: unless-stopped
    # Docker's default is 10s, which would SIGKILL the gateway mid-drain and lose messages
    # that were already accepted with a 202. Keep this above WAC_SHUTDOWN_DRAIN_TIMEOUT_MS.
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
